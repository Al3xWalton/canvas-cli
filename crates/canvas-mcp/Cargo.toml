[package]
name = "canvas-mcp"
description = "MCP server that gives agents Canvas CLI's tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "canvas-mcp"
path = "src/main.rs"

[dependencies]
canvas-core.workspace = true
clap.workspace = true
anyhow.workspace = true
canvas-auth.workspace = true
canvas-api.workspace = true
canvas-sync.workspace = true
panopto.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }

[lints]
workspace = true
