[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Al3xWalton/canvas-cli"
authors = ["Alexander Walton <alexander@walton-i.com>"]
rust-version = "1.95"

[workspace.dependencies]
canvas-core = { path = "crates/canvas-core" }
canvas-auth = { path = "crates/canvas-auth" }
canvas-api = { path = "crates/canvas-api" }
canvas-sync = { path = "crates/canvas-sync" }
panopto = { path = "crates/panopto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3", features = ["apple-native"] }
chromiumoxide = { version = "0.9", default-features = false }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
